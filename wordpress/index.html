<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcor Solutions</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1f2937;
            background: #f5f7fa;
        }

        .site-header {
            padding: 20px 40px;
            background: #ffffff;
            border-bottom: 1px solid #e2e7ee;
            font-size: 18px;
            font-weight: 700;
            color: #0f1b2d;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 96px 24px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 38px;
            line-height: 1.15;
            letter-spacing: -0.5px;
            color: #0f1b2d;
        }

        p {
            margin: 0;
            font-size: 17px;
            line-height: 1.65;
            color: #5b6675;
        }
    </style>
</head>

<body>

    <header class="site-header">Alcor Solutions</header>

    <main>
        <h1>Welcome to Alcor Solutions</h1>
        <p>
            This is a proof-of-concept page. Use the chat button at the
            bottom right to ask questions about Alcor, its services and
            its leadership.
        </p>
    </main>

    <!--
        Ask Alcor chat widget.
        Set data-api-url to your backend endpoint.
    -->
    <script
        src="widget.js"
        data-api-url="http://127.0.0.1:8000/api/chat"
    ></script>

</body>
</html>
